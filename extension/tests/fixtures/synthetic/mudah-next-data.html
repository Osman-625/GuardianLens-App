<!doctype html>
<!--
  Synthetic Mudah listing that mirrors the structure of a live Mudah page recorded on 2026-10-06
  (all text and ids here are invented):
    - the JSON-LD holds only WebSite and Organization nodes (no Product);
    - the meta description is a GENERATED sentence (title + category + place), not the seller's text;
    - the visible page has no price for the ad, but a "You May Also Like" list full of other ads' prices;
    - the real data sits in the embedded __NEXT_DATA__ script: the ad record appears twice (camelCase
      and snake_case copies) and the related ads carry their own records;
    - photos are served from rnudah.com, not mudah.my.
-->
