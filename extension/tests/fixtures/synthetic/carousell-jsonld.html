<!doctype html>
<!-- Synthetic Carousell-style listing: all fields are in JSON-LD structured data. -->
<html lang="en">
  <head>
    <title>Used laptop in good condition | Carousell Malaysia</title>
    <meta
      property="og:title"
      content="Used laptop in good condition - Carousell Malaysia"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Product",
            "name": "Used laptop in good condition",
            "description": "Original unit, battery health 90 percent. COD available around Shah Alam.",
            "image": [
              "https://media.karousell.com/media/photos/products/1/a.jpg",
              "https://media.karousell.com/media/photos/products/1/b.jpg"
            ],
            "offers": {
              "@type": "Offer",
              "price": "1250.00",
              "priceCurrency": "MYR"
            }
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "Home" },
              {
                "@type": "ListItem",
                "position": 2,
                "name": "Computers and Tech"
              },
              { "@type": "ListItem", "position": 3, "name": "Laptops" }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Used laptop in good condition</h1>
      <div class="gallery">
        <img
          src="https://media.karousell.com/media/photos/products/1/a.jpg"
          width="640"
          height="480"
          alt=""
        />
        <img
          src="https://media.karousell.com/media/photos/products/1/b.jpg"
          width="640"
          height="480"
          alt=""
        />
      </div>
      <p class="price">RM 1,250</p>
    </main>
  </body>
</html>
