name: ci

on:
  push:
  pull_request:

# CI installs the API's pinned test dependencies with pip (requirements-dev.txt, no model packages).
# Local development uses the conda environment in environment.yml instead.
jobs:
  # The Python side: lint, type-check, run the tests, then the secret scan and the prose check.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check api ml scripts
      - run: mypy api ml/src/guardianlens_ml
      - run: pytest -q
      - run: python scripts/secret_scan.py
      - run: python scripts/check_prose.py

  # The JavaScript side (shared package, extension, website): lint, type-check, test, and build.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # One install at the repository root covers the shared, extension, and frontend workspaces.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
