# The development stub bundle: the settings the API uses when no trained run is loaded. It exists
# only to exercise the interface. Nothing here is a trained model or a research result, so the
# band boundaries below are placeholders and the evidence flag stays false.
run_id: dev-stub-001
mode: development_stub
seed: 42
dataset_version: none
warning: "This config does not represent a trained model or research result."
# The version label of each component; the stubs are simple rules, and there is no calibrator.
components:
  visual: contract-stub-v1
  textual: contract-stub-v1
  behavioural: contract-stub-v1
  fusion: mean-stub-v1
  calibrator: none
  explanation: template-stub-v1
# Highest score of the Low band and of the Moderate band (0 to 100).
band_boundaries:
  low_max: 33
  moderate_max: 66
# Stub output must never be used as evidence in the report or the user study.
research_evidence_valid: false
