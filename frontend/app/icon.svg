<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32">
  <!-- The GuardianLens mark on its navy tile, for the extension toolbar icon and the website tab icon.
       The ring is the same drawing as shared/src/components/Wordmark.tsx (radius 12, stroke 3, one lit
       arc, a dark arc, a centre dot), scaled to sit inside the tile and coloured for a dark ground. -->
  <rect width="32" height="32" rx="7" fill="#0f1b2d" />
  <g transform="translate(16 16) scale(0.78) translate(-16 -16)" fill="none" stroke-width="3" stroke-linecap="round">
    <circle cx="16" cy="16" r="12" stroke="#ffffff" opacity="0.22" />
    <path d="M16 4a12 12 0 0 1 12 12" stroke="#7da0ff" />
    <path d="M28 16a12 12 0 0 1-12 12" stroke="#ffffff" />
    <circle cx="16" cy="16" r="3.5" fill="#ffffff" stroke="none" />
  </g>
</svg>
